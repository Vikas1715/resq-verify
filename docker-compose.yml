# Optional. Not required for normal use (the file store works without Docker).
# Not tested in the development environment: treat as a starting point.
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  backend:
    build: .
    command: uvicorn backend.app.api.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      STORAGE_BACKEND: mongo
      MONGODB_URI: mongodb://mongo:27017
    volumes: ["./data:/app/data"]
    ports: ["8000:8000"]
    depends_on: [mongo]
  frontend:
    build: .
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["8501:8501"]
    depends_on: [backend]
volumes:
  mongo_data:
